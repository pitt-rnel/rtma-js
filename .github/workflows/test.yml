name: Tests

# Runs the tests that don't need pyrtma. The end-to-end tests skip
# themselves, since pyrtma isn't installed here: they need the matching
# pyrtma, which may not be released yet, so run them locally.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # rtma-js has no dependencies, so there is nothing to install.
      - run: npm test
